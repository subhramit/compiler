name: C compiler CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux / ${{ matrix.compiler }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    env:
      CC: ${{ matrix.compiler }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes make "${{ matrix.compiler }}"
      - name: Build compiler and assembly runtime
        run: |
          make clean
          make -j2
      - name: Test lexer and parser
        run: python src/parser/test_frontend.py "${{ matrix.compiler }}"
      - name: Test assembly backend and executable production
        run: python tests/test_compiler.py --compiler build/compiler --cc "${{ matrix.compiler }}"

  windows:
    name: Windows / Zig
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - name: Install pinned Zig toolchain
        run: python -m pip install --disable-pip-version-check --no-input --target build/toolchain ziglang==0.17.1
      - name: Build compiler and assembly runtime
        run: call build.cmd "%CD%\build\toolchain\ziglang\zig.exe"
      - name: Test lexer and parser
        run: python src/parser/test_frontend.py build\toolchain\ziglang\zig.exe
      - name: Test assembly backend and executable production
        run: python tests/test_compiler.py --compiler build\compiler.exe --cc build\toolchain\ziglang\zig.exe
